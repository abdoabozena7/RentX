<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة تحكم موقع تأجير السيارات</title>
  <style>
    :root{
      --bg:#0f172a;          /* slate-900 */
      --panel:#111827;       /* gray-900 */
      --muted:#1f2937;       /* gray-800 */
      --card:#0b1225;        
      --text:#e5e7eb;        /* gray-200 */
      --text-dim:#9ca3af;    /* gray-400 */
      --brand:#22c55e;       /* green-500 */
      --brand-2:#38bdf8;     /* sky-400 */
      --danger:#ef4444;      /* red-500 */
      --warning:#f59e0b;     /* amber-500 */
      --ok:#10b981;          /* emerald-500 */
      --radius:18px;
      --shadow:0 12px 30px rgba(0,0,0,.25);
    }
    html,body{height:100%}
    *{box-sizing:border-box}
    body{
      margin:0;background:linear-gradient(180deg,#0b1225,#0a0f1f);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Noto Sans Arabic",sans-serif;
    }
    a{color:inherit;text-decoration:none}

    /* Layout */
    .app{
      min-height:100vh;display:grid;grid-template-columns:280px 1fr;gap:18px;
      padding:18px;
    }
    @media (max-width: 992px){.app{grid-template-columns:1fr}} 

    .sidebar{
      background:linear-gradient(180deg,var(--panel),#0c1328);border-radius:var(--radius);
      padding:16px;box-shadow:var(--shadow);position:sticky;top:18px;height:calc(100vh - 36px);
    }
    @media (max-width: 992px){.sidebar{position:static;height:auto}}

    .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#16a34a);display:grid;place-items:center;font-weight:800}
    .brand h1{font-size:18px;margin:0}
    .search{margin:10px 0 16px}
    .search input{
      width:100%;padding:12px;border-radius:12px;border:1px solid #24324f;background:#0a132a;color:var(--text);
      outline:none
    }

    .menu{display:grid;gap:8px}
    .menu button{
      text-align:right;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #1e293b;
      background:#0b142b;color:var(--text);cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center
    }
    .menu button.active,.menu button:hover{background:linear-gradient(90deg,#0e1a36,rgba(56,189,248,.12));border-color:#2b3c63}

    .main{
      display:grid;grid-template-rows:auto 1fr;gap:18px
    }

    .topbar{
      background:linear-gradient(90deg,#0e172d,#0c1b34);border-radius:var(--radius);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)
    }
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{padding:8px 12px;border-radius:999px;background:#0b152e;border:1px solid #223055;font-size:12px;color:var(--text-dim)}

    .content{display:grid;gap:16px}

    .card{
      background:linear-gradient(180deg,#0d1731,#0a1227);border:1px solid #1f2b4a;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)
    }
    .card h3{margin:0 0 10px;font-size:18px}
    .grid{display:grid;gap:12px}
    .grid.cols-2{grid-template-columns:1fr 1fr}
    .grid.cols-3{grid-template-columns:repeat(3,1fr)}
    .grid.cols-4{grid-template-columns:repeat(4,1fr)}
    @media (max-width: 1200px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}}
    @media (max-width: 768px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}

    .btn{
      padding:10px 14px;border-radius:12px;border:1px solid #274069;background:#0d1d3e;color:var(--text);cursor:pointer
    }
    .btn.primary{background:linear-gradient(90deg,var(--brand-2),#60a5fa);color:#041020;border-color:transparent;font-weight:700}
    .btn.ghost{background:transparent;border-color:#2a3b63}
    .btn.danger{background:linear-gradient(90deg,#ef4444,#f97316);border-color:transparent;color:white}
    .btn.success{background:linear-gradient(90deg,#22c55e,#10b981);border-color:transparent;color:#032312}

    form .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    form .row > *{min-width:0}
    @media (max-width: 992px){form .row{grid-template-columns:1fr 1fr}}
    @media (max-width: 640px){form .row{grid-template-columns:1fr}}

    label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px}
    input,select,textarea{
      width:100%;padding:12px;border-radius:12px;border:1px solid #223055;background:#0a142c;color:var(--text);
      outline:none
    }
    textarea{min-height:96px;resize:vertical}

    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #1f2b4a;text-align:right}
    th{color:#9fb0d8;font-weight:600}
    tr:hover{background:#0b152f}

    .tag{padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid #223055;background:#0c1733;color:#9fb0d8;display:inline-block}
    .tag.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.3);color:#34d399}
    .tag.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:#fbbf24}
    .tag.bad{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#f87171}

    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}

    .empty{padding:20px;border:1px dashed #2a3b63;border-radius:14px;text-align:center;color:var(--text-dim)}

    .footer{opacity:.6;font-size:12px;text-align:center;margin:12px 0}
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">🚗</div>
        <h1>لوحة تحكم التأجير</h1>
      </div>
      <div class="search"><input id="globalSearch" placeholder="بحث عام…"></div>
      <nav class="menu">
        <button class="active" data-view="dashboard">📊 لوحة المعلومات</button>
        <button data-view="cars">🚘 السيارات</button>
        <button data-view="reservations">📅 الحجوزات</button>
        <button data-view="shipments">📦 الاستيراد/التصدير والجمارك</button>
        <button data-view="surveys">📝 الاستبيانات (العملاء + مكيفات صحراوية)</button>
        <button data-view="website">🌐 معاينة موقع العملاء</button>
        <button data-view="settings">⚙️ الإعدادات</button>
      </nav>
    </aside>

    <!-- Main -->
    <section class="main">
      <div class="topbar">
        <div class="chips">
          <span class="chip">حالة النظام: <b style="color:#34d399">نشط</b></span>
          <span class="chip">التاريخ: <span id="today"></span></span>
          <span class="chip">السعة الحالية: <span id="fleetCount">0</span> سيارة</span>
          <span class="chip">حجوزات مفتوحة: <span id="openRes">0</span></span>
        </div>
        <div class="chips">
          <button class="btn ghost" id="seedBtn">ملء بيانات تجريبية</button>
          <button class="btn success" id="exportAll">تصدير كل البيانات (JSON)</button>
        </div>
      </div>

      <div class="content" id="view-container">
        <!-- Views injected here by JS -->
      </div>

      <div class="footer">© <span id="year"></span> نظام إدارة تأجير السيارات – واجهة تجريبية تعمل محليًا (LocalStorage)</div>
    </section>
  </div>

<script>
/*************************
 * تخزين محلي + أدوات عامة
 *************************/
const db = {
  cars: [],         // {id, name, model, pricePerDay, details, imageData}
  reservations: [], // {id, carId, customerName, phone, nationalId, startDate, endDate, status}
  leads: [],        // {id, name, phone, email, message, createdAt}
  acLeads: [],      // {id, name, phone, city, capacity, useCase, createdAt}
  shipments: []     // {id, type, description, status, eta, ref}
};

const LSK = 'rental_dashboard_v1';
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const uid = () => Math.random().toString(36).slice(2,10);

function load(){
  const raw = localStorage.getItem(LSK);
  if(raw){
    const obj = JSON.parse(raw);
    Object.assign(db, obj);
  }
}
function save(){
  localStorage.setItem(LSK, JSON.stringify(db));
  updateTopStats();
}
function clearAll(){ localStorage.removeItem(LSK); location.reload(); }

function formatMoney(n){
  const x = Number(n||0);
  return new Intl.NumberFormat('ar-EG', {style:'currency', currency:'EGP'}).format(x);
}

function download(filename, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}

/****************
 * واجهات العرض
 ****************/
const views = {
  dashboard(){
    return `
    <div class="grid cols-4">
      <div class="card"><h3>إجمالي السيارات</h3><div class="tag ok"><span id="s-fleet">${db.cars.length}</span> سيارة</div></div>
      <div class="card"><h3>حجوزات قيد التنفيذ</h3><div class="tag warn"><span id="s-open">${db.reservations.filter(r=>r.status==='جاري').length}</span></div></div>
      <div class="card"><h3>شحنات نشطة</h3><div class="tag warn"><span id="s-ship">${db.shipments.filter(s=>s.status!=='منتهية').length}</span></div></div>
      <div class="card"><h3>إجمالي العملاء الجدد</h3><div class="tag"><span id="s-leads">${db.leads.length}</span> (+ مكيفات: ${db.acLeads.length})</div></div>
    </div>

    <div class="grid cols-2">
      <div class="card" id="latestReservations">
        <h3>آخر الحجوزات</h3>
        ${db.reservations.length?`
        <div class="toolbar">
          <input id="resSearch" placeholder="بحث بالاسم أو الهاتف…" />
          <button class="btn" id="exportRes">تصدير CSV</button>
        </div>
        <div class="table-wrap"><table><thead><tr>
          <th>العميل</th><th>الهاتف</th><th>السيارة</th><th>الفترة</th><th>الحالة</th><th></th>
        </tr></thead><tbody>
        ${db.reservations.slice().reverse().slice(0,8).map(r=>{
          const car = db.cars.find(c=>c.id===r.carId); 
          return `<tr data-id="${r.id}"><td>${r.customerName}</td><td>${r.phone}</td><td>${car?car.name:'—'}</td><td>${r.startDate} → ${r.endDate}</td><td><span class="tag ${r.status==='جاري'?'warn':r.status==='ملغي'?'bad':'ok'}">${r.status}</span></td><td><button class="btn ghost" data-action="toggle-status">تغيير</button></td></tr>`;
        }).join('')}
        </tbody></table></div>` : `<div class="empty">لا توجد حجوزات بعد.</div>`}
      </div>

      <div class="card">
        <h3>أحدث العملاء عبر الاستبيان</h3>
        ${db.leads.length?`
        <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th><th>ملخص</th></tr></thead><tbody>
          ${db.leads.slice().reverse().slice(0,8).map(l=>`<tr><td>${l.name}</td><td>${l.phone}</td><td>${l.email||'—'}</td><td>${(l.message||'').slice(0,40)}…</td></tr>`).join('')}
        </tbody></table>`:`<div class="empty">لا يوجد عملاء جدد بعد.</div>`}
      </div>
    </div>`
  },

  cars(){
    return `
    <div class="card">
      <h3>إضافة/تعديل سيارة</h3>
      <form id="carForm">
        <input type="hidden" name="id" />
        <div class="row">
          <div><label>اسم السيارة</label><input name="name" required placeholder="مثال: تويوتا كورولا" /></div>
          <div><label>الموديل</label><input name="model" required placeholder="2022" /></div>
          <div><label>السعر/اليوم (EGP)</label><input name="pricePerDay" type="number" min="0" required /></div>
          <div><label>صورة السيارة</label><input name="image" type="file" accept="image/*" /></div>
          <div style="grid-column:1/-1"><label>تفاصيل</label><textarea name="details" placeholder="ناقل حركة، الوقود، المزايا…"></textarea></div>
        </div>
        <div class="toolbar">
          <button class="btn primary" type="submit">حفظ</button>
          <button class="btn ghost" type="reset">تفريغ</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>قائمة السيارات</h3>
      <div class="toolbar">
        <input id="carSearch" placeholder="بحث باسم السيارة…" />
        <button class="btn" id="exportCars">تصدير CSV</button>
      </div>
      ${db.cars.length?`
      <table><thead><tr><th>الصورة</th><th>الاسم</th><th>الموديل</th><th>السعر/اليوم</th><th>تفاصيل</th><th></th></tr></thead><tbody>
        ${db.cars.map(c=>`
          <tr data-id="${c.id}">
            <td>${c.imageData?`<img src="${c.imageData}" alt="${c.name}" style="width:70px;height:46px;object-fit:cover;border-radius:10px;border:1px solid #223055">`:'—'}</td>
            <td>${c.name}</td>
            <td>${c.model}</td>
            <td>${formatMoney(c.pricePerDay)}</td>
            <td>${(c.details||'').slice(0,60)}${(c.details||'').length>60?'…':''}</td>
            <td>
              <button class="btn" data-action="edit">تعديل</button>
              <button class="btn danger" data-action="delete">حذف</button>
            </td>
          </tr>
        `).join('')}
      </tbody></table>
      `:`<div class="empty">أضف سيارات لعرضها هنا.</div>`}
    </div>`
  },

  reservations(){
    return `
    <div class="card">
      <h3>جميع الحجوزات</h3>
      <div class="toolbar">
        <select id="resFilter"><option value="all">الكل</option><option value="جاري">جاري</option><option value="مكتمل">مكتمل</option><option value="ملغي">ملغي</option></select>
        <input id="resSearch2" placeholder="بحث باسم العميل/الهاتف" />
        <button class="btn" id="exportRes2">تصدير CSV</button>
      </div>
      ${db.reservations.length?`
      <table><thead><tr><th>العميل</th><th>الهاتف</th><th>السيارة</th><th>الفترة</th><th>الحالة</th><th></th></tr></thead><tbody id="resTBody">
        ${db.reservations.map(r=>{
          const car = db.cars.find(c=>c.id===r.carId); 
          return `<tr data-id="${r.id}"><td>${r.customerName}</td><td>${r.phone}</td><td>${car?car.name:'—'}</td><td>${r.startDate} → ${r.endDate}</td><td><span class="tag ${r.status==='جاري'?'warn':r.status==='ملغي'?'bad':'ok'}">${r.status}</span></td><td><button class="btn ghost" data-action="toggle-status">تبديل الحالة</button></td></tr>`;
        }).join('')}
      </tbody></table>`:`<div class="empty">لا توجد حجوزات.</div>`}
    </div>`
  },

  shipments(){
    return `
    <div class="grid cols-2">
      <div class="card">
        <h3>إضافة شحنة</h3>
        <form id="shipForm">
          <div class="row">
            <div><label>النوع</label><select name="type"><option>استيراد</option><option>تصدير</option><option>تخليص جمركي</option></select></div>
            <div><label>المرجع</label><input name="ref" placeholder="رقم مرجعي" required></div>
            <div><label>الحالة</label><select name="status"><option>قيد المعالجة</option><option>بانتظار المستندات</option><option>منتهية</option></select></div>
            <div><label>ETA تاريخ متوقع</label><input name="eta" type="date"></div>
            <div style="grid-column:1/-1"><label>الوصف</label><textarea name="description" placeholder="تفاصيل الشحنة أو جهة الوصول…"></textarea></div>
          </div>
          <div class="toolbar"><button class="btn primary">حفظ</button></div>
        </form>
      </div>
      <div class="card">
        <h3>الشحنات</h3>
        <div class="toolbar">
          <select id="shipFilter"><option value="all">الكل</option><option>قيد المعالجة</option><option>بانتظار المستندات</option><option>منتهية</option></select>
          <button class="btn" id="exportShip">تصدير CSV</button>
        </div>
        ${db.shipments.length?`
        <table><thead><tr><th>النوع</th><th>المرجع</th><th>الحالة</th><th>ETA</th><th>الوصف</th><th></th></tr></thead><tbody id="shipTBody">
          ${db.shipments.map(s=>`
            <tr data-id="${s.id}">
              <td>${s.type}</td>
              <td>${s.ref}</td>
              <td><span class="tag ${s.status==='منتهية'?'ok':'warn'}">${s.status}</span></td>
              <td>${s.eta||'—'}</td>
              <td>${(s.description||'').slice(0,50)}${(s.description||'').length>50?'…':''}</td>
              <td><button class="btn ghost" data-action="ship-status">تبديل الحالة</button> <button class="btn danger" data-action="ship-del">حذف</button></td>
            </tr>
          `).join('')}
        </tbody></table>`:`<div class="empty">لا توجد شحنات.</div>`}
      </div>
    </div>`
  },

  surveys(){
    return `
    <div class="grid cols-2">
      <div class="card">
        <h3>نتائج استبيان العملاء (جذب عملاء)</h3>
        ${db.leads.length?`
        <div class="toolbar"><button class="btn" id="exportLeads">تصدير CSV</button></div>
        <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th><th>الرسالة</th><th>التاريخ</th></tr></thead><tbody>
          ${db.leads.map(l=>`<tr><td>${l.name}</td><td>${l.phone}</td><td>${l.email||'—'}</td><td>${l.message||''}</td><td>${new Date(l.createdAt).toLocaleString('ar-EG')}</td></tr>`).join('')}
        </tbody></table>`:`<div class="empty">لا نتائج بعد. استخدم نموذج الموقع.</div>`}
      </div>
      <div class="card">
        <h3>استبيان بيع المكيفات الصحراوية</h3>
        ${db.acLeads.length?`
        <div class="toolbar"><button class="btn" id="exportAC">تصدير CSV</button></div>
        <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المدينة</th><th>السعة</th><th>الاستخدام</th><th>التاريخ</th></tr></thead><tbody>
          ${db.acLeads.map(l=>`<tr><td>${l.name}</td><td>${l.phone}</td><td>${l.city}</td><td>${l.capacity}</td><td>${l.useCase}</td><td>${new Date(l.createdAt).toLocaleString('ar-EG')}</td></tr>`).join('')}
        </tbody></table>`:`<div class="empty">لا نتائج بعد. استخدم نموذج الموقع.</div>`}
      </div>
    </div>`
  },

  website(){
    // واجهة عامة يحفظ بياناتها في LocalStorage نفسه
    return `
    <div class="grid cols-2">
      <div class="card">
        <h3>كتالوج السيارات (واجهة العميل)</h3>
        ${db.cars.length?`
        <div class="grid cols-2">
          ${db.cars.map(c=>`
            <div class="card" style="background:#0a162f">
              <div style="display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center">
                <img src="${c.imageData||''}" alt="${c.name}" style="width:120px;height:80px;object-fit:cover;border-radius:12px;border:1px solid #223055" onerror="this.style.display='none'">
                <div>
                  <div style="font-weight:700">${c.name} <small style="color:#9fb0d8">${c.model}</small></div>
                  <div class="tag">${formatMoney(c.pricePerDay)}/اليوم</div>
                </div>
              </div>
              <p style="color:#a8b3d1">${c.details||''}</p>
              <button class="btn primary" onclick="reserve('${c.id}')">حجز هذه السيارة</button>
            </div>
          `).join('')}
        </div>`:`<div class="empty">لا توجد سيارات بعد — أضف من لوحة التحكم.</div>`}
      </div>

      <div class="grid cols-1">
        <div class="card">
          <h3>نموذج الحجز السريع</h3>
          <form id="reserveForm">
            <div class="row">
              <div><label>الاسم الكامل</label><input name="customerName" required></div>
              <div><label>الهاتف</label><input name="phone" required></div>
              <div><label>الرقم القومي/جواز</label><input name="nationalId" required></div>
              <div><label>السيارة</label><select name="carId">${db.cars.map(c=>`<option value="${c.id}">${c.name} (${c.model})</option>`).join('')}</select></div>
              <div><label>من</label><input type="date" name="startDate" required></div>
              <div><label>إلى</label><input type="date" name="endDate" required></div>
            </div>
            <div class="toolbar"><button class="btn success">تأكيد الحجز</button></div>
          </form>
        </div>

        <div class="card">
          <h3>استبيان العملاء الجدد</h3>
          <form id="leadForm">
            <div class="row">
              <div><label>الاسم</label><input name="name" required></div>
              <div><label>الهاتف</label><input name="phone" required></div>
              <div><label>البريد</label><input name="email" type="email" placeholder="اختياري"></div>
              <div style="grid-column:1/-1"><label>ماذا تحتاج؟</label><textarea name="message" placeholder="اكتب متطلباتك"></textarea></div>
            </div>
            <div class="toolbar"><button class="btn primary">إرسال</button></div>
          </form>
        </div>

        <div class="card">
          <h3>استبيان شراء مكيفات صحراوية</h3>
          <form id="acForm">
            <div class="row">
              <div><label>الاسم</label><input name="name" required></div>
              <div><label>الهاتف</label><input name="phone" required></div>
              <div><label>المدينة</label><input name="city"></div>
              <div><label>السعة المطلوبة (لتر/ساعة)</label><input name="capacity" type="number" min="0"></div>
              <div style="grid-column:1/-1"><label>الاستخدام</label><textarea name="useCase" placeholder="منزل/مخزن/مزرعة…"></textarea></div>
            </div>
            <div class="toolbar"><button class="btn primary">إرسال الطلب</button></div>
          </form>
        </div>
      </div>

    </div>`
  },

  settings(){
    return `
    <div class="card">
      <h3>إعدادات / أدوات المطور</h3>
      <div class="toolbar">
        <button class="btn danger" id="clearAll">مسح كل البيانات</button>
      </div>
      <p class="tag">ملاحظة: هذا النموذج تجريبي ويعمل بالكامل داخل المتصفح باستخدام LocalStorage.</p>
    </div>`
  }
};

/****************
 * ربط الواجهات
 ****************/
function render(view='dashboard'){
  const html = views[view]();
  $('#view-container').innerHTML = html;
  $$('.menu button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  bindDynamicHandlers(view);
}

function updateTopStats(){
  $('#fleetCount').textContent = db.cars.length;
  $('#openRes').textContent = db.reservations.filter(r=>r.status==='جاري').length;
  if($('#s-fleet')) $('#s-fleet').textContent = db.cars.length;
  if($('#s-open')) $('#s-open').textContent = db.reservations.filter(r=>r.status==='جاري').length;
  if($('#s-ship')) $('#s-ship').textContent = db.shipments.filter(s=>s.status!=='منتهية').length;
  if($('#s-leads')) $('#s-leads').textContent = db.leads.length;
}

/****************
 * أحداث عامة
 ****************/
window.addEventListener('DOMContentLoaded',()=>{
  load();
  $('#today').textContent = new Date().toLocaleDateString('ar-EG');
  $('#year').textContent = new Date().getFullYear();
  render('dashboard');

  $$('.menu button').forEach(btn=>btn.addEventListener('click',()=>render(btn.dataset.view)));

  $('#seedBtn').addEventListener('click', seedData);
  $('#exportAll').addEventListener('click',()=>download('backup.json', JSON.stringify(db,null,2)));
});

/****************
 * معالجات حسب الواجهة
 ****************/
function bindDynamicHandlers(view){
  if(view==='dashboard'){
    const latest = $('#latestReservations');
    latest?.addEventListener('click', e=>{
      const tr = e.target.closest('tr');
      if(!tr) return;
      const id = tr.dataset.id;
      if(e.target.matches('[data-action="toggle-status"]')){
        const r = db.reservations.find(x=>x.id===id);
        r.status = r.status==='جاري'?'مكتمل':r.status==='مكتمل'?'ملغي':'جاري';
        save(); render('dashboard');
      }
    });
    $('#exportRes')?.addEventListener('click',()=>exportCSV('reservations.csv', db.reservations));
    $('#resSearch')?.addEventListener('input', e=>{
      const q = e.target.value.trim();
      $$('#latestReservations tbody tr').forEach(tr=>{
        const txt = tr.textContent; tr.style.display = txt.includes(q)?'':'none';
      });
    });
  }

  if(view==='cars'){
    const form = $('#carForm');
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(form);
      const id = fd.get('id')||uid();
      const img = fd.get('image');
      let imageData = null;
      if(img && img.size){ imageData = await fileToData(img); }
      const newCar = {
        id,
        name: fd.get('name'),
        model: fd.get('model'),
        pricePerDay: Number(fd.get('pricePerDay')),
        details: fd.get('details'),
        imageData
      };
      const idx = db.cars.findIndex(c=>c.id===id);
      if(idx>-1){ // edit
        db.cars[idx] = {...db.cars[idx], ...newCar, imageData: imageData||db.cars[idx].imageData};
      } else {
        db.cars.push(newCar);
      }
      save(); render('cars');
    });

    // تقارير وتصدير
    $('#exportCars')?.addEventListener('click',()=>{
      const rows = db.cars.map(c=>({id:c.id,name:c.name,model:c.model,pricePerDay:c.pricePerDay,details:c.details}));
      exportCSV('cars.csv', rows);
    });

    // بحث
    $('#carSearch')?.addEventListener('input', e=>{
      const q = e.target.value.trim();
      $$('#view-container tbody tr').forEach(tr=>{
        tr.style.display = tr.textContent.includes(q)?'':'none';
      });
    });

    // أزرار لكل صف
    $('#view-container').addEventListener('click', e=>{
      const tr = e.target.closest('tr'); if(!tr) return;
      const id = tr.dataset.id;
      if(e.target.matches('[data-action="edit"]')){
        const c = db.cars.find(x=>x.id===id);
        form.name.value = c.name;
        form.model.value = c.model;
        form.pricePerDay.value = c.pricePerDay;
        form.details.value = c.details||'';
        form.id.value = c.id;
        form.scrollIntoView({behavior:'smooth'});
      }
      if(e.target.matches('[data-action="delete"]')){
        if(confirm('حذف هذه السيارة؟')){
          db.cars = db.cars.filter(c=>c.id!==id);
          save(); render('cars');
        }
      }
    });
  }

  if(view==='reservations'){
    $('#exportRes2')?.addEventListener('click',()=>exportCSV('reservations.csv', db.reservations));
    const tbody = $('#resTBody');
    tbody?.addEventListener('click', e=>{
      const tr = e.target.closest('tr'); if(!tr) return;
      const id = tr.dataset.id;
      if(e.target.matches('[data-action="toggle-status"]')){
        const r = db.reservations.find(x=>x.id===id);
        r.status = r.status==='جاري'?'مكتمل':r.status==='مكتمل'?'ملغي':'جاري';
        save(); render('reservations');
      }
    });
    $('#resFilter')?.addEventListener('change', e=>{
      const val = e.target.value;
      $$('#resTBody tr').forEach(tr=>{
        const status = tr.querySelector('.tag').textContent.trim();
        tr.style.display = val==='all'||status===val?'':'none';
      });
    });
    $('#resSearch2')?.addEventListener('input', e=>{
      const q = e.target.value.trim();
      $$('#resTBody tr').forEach(tr=>{tr.style.display = tr.textContent.includes(q)?'':'none'});
    });
  }

  if(view==='shipments'){
    const form = $('#shipForm');
    form?.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(form);
      db.shipments.push({
        id: uid(), type: fd.get('type'), ref: fd.get('ref'), status: fd.get('status'), eta: fd.get('eta'), description: fd.get('description')
      });
      save(); render('shipments');
    });
    const tbody = $('#shipTBody');
    tbody?.addEventListener('click', e=>{
      const tr = e.target.closest('tr'); if(!tr) return;
      const id = tr.dataset.id;
      if(e.target.matches('[data-action="ship-status"]')){
        const s = db.shipments.find(x=>x.id===id);
        s.status = s.status==='منتهية'?'قيد المعالجة':s.status==='قيد المعالجة'?'بانتظار المستندات':'منتهية';
        save(); render('shipments');
      }
      if(e.target.matches('[data-action="ship-del"]')){
        if(confirm('حذف هذه الشحنة؟')){
          db.shipments = db.shipments.filter(x=>x.id!==id); save(); render('shipments');
        }
      }
    });
    $('#shipFilter')?.addEventListener('change', e=>{
      const val = e.target.value;
      $$('#shipTBody tr').forEach(tr=>{
        const status = tr.querySelector('.tag').textContent.trim();
        tr.style.display = val==='all'||status===val?'':'none';
      });
    });
    $('#exportShip')?.addEventListener('click',()=>exportCSV('shipments.csv', db.shipments));
  }

  if(view==='surveys'){
    $('#exportLeads')?.addEventListener('click',()=>exportCSV('leads.csv', db.leads));
    $('#exportAC')?.addEventListener('click',()=>exportCSV('ac_leads.csv', db.acLeads));
  }

  if(view==='website'){
    // حجز
    $('#reserveForm')?.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      db.reservations.push({
        id: uid(),
        carId: fd.get('carId'),
        customerName: fd.get('customerName'),
        phone: fd.get('phone'),
        nationalId: fd.get('nationalId'),
        startDate: fd.get('startDate'),
        endDate: fd.get('endDate'),
        status: 'جاري'
      });
      save(); alert('تم استلام الحجز!'); e.target.reset();
    });
    // استبيان العملاء
    $('#leadForm')?.addEventListener('submit', e=>{
      e.preventDefault(); const fd = new FormData(e.target);
      db.leads.push({id: uid(), name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), message: fd.get('message'), createdAt: Date.now()});
      save(); alert('شكرًا لك! سنعاود الاتصال قريبًا.'); e.target.reset();
    });
    // استبيان المكيفات
    $('#acForm')?.addEventListener('submit', e=>{
      e.preventDefault(); const fd = new FormData(e.target);
      db.acLeads.push({id: uid(), name: fd.get('name'), phone: fd.get('phone'), city: fd.get('city'), capacity: fd.get('capacity'), useCase: fd.get('useCase'), createdAt: Date.now()});
      save(); alert('تم إرسال الطلب بنجاح.'); e.target.reset();
    });
  }

  if(view==='settings'){
    $('#clearAll')?.addEventListener('click',()=>{
      if(confirm('هل تريد مسح جميع البيانات؟')) clearAll();
    });
  }
}

/****************
 * وظائف مساعدة
 ****************/
async function fileToData(file){
  return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}

function exportCSV(filename, rows){
  if(!rows.length) return alert('لا توجد بيانات للتصدير');
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(',')].concat(rows.map(r=>headers.map(h=>JSON.stringify(r[h]??'')).join(','))).join('\n');
  download(filename, csv);
}

function reserve(carId){
  // تعبئة اختيار السيارة في نموذج الحجز
  const sel = document.querySelector('#reserveForm select[name="carId"]');
  if(sel){ sel.value = carId; sel.scrollIntoView({behavior:'smooth'}); }
}
