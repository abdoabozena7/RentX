<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج الخدمة</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #fdfdfd;
      color: #000;
    }
    .form-container {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-top: 8px solid #ff7a00;
    }
    .btn-orange {
      background-color: #ff7a00;
      color: #fff;
      font-weight: bold;
    }
    .btn-orange:hover {
      background-color: #e66a00;
      color: #fff;
    }
    label {
      font-weight: 600;
    }
    .header {
      text-align: center;
      margin: 20px 0;
    }
    .header img {
      max-width: 120px;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 1.5rem;
      color: #ff7a00;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- الهيدر -->
    <div class="header">
      <img src="img/logo.png" alt="شعار المؤسسة">
      <h1>مرحباً بكم في مؤسسة عساف للسياحة والتجارة</h1>
    </div>

    <div class="form-container">
      <h2 class="text-center mb-4">نموذج طلب الخدمة</h2>
      <form id="serviceForm">
        <div class="mb-3">
          <label for="name" class="form-label">الاسم الكامل</label>
          <input type="text" class="form-control" id="name" placeholder="أدخل اسمك" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">رقم الهاتف</label>
          <div class="input-group">
            <select class="form-select" id="phoneCode" style="max-width: 120px;">
              <option value="+963">+963 سوريا</option>
              <option value="+90">+90 تركيا</option>
            </select>
            <input type="tel" class="form-control" id="phone" placeholder="أدخل رقمك" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="country" class="form-label">اختيار البلد</label>
          <select id="country" class="form-select" required>
            <option value="">اختر البلد</option>
            <option value="syria">سوريا</option>
            <option value="turkey">تركيا</option>
          </select>
        </div>

        <!-- اختيار نوع الشحن -->
        <div class="mb-3">
          <label class="form-label">نوع الشحن</label>
          <select id="shippingType" class="form-select" required>
            <option value="">اختر نوع الشحن</option>
            <option value="land">شحن بري</option>
            <option value="sea">شحن بحري</option>
            <option value="air">شحن جوي</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="details" class="form-label">تفاصيل الخدمة</label>
          <textarea class="form-control" id="details" rows="4" placeholder="أدخل تفاصيل الخدمة المطلوبة"></textarea>
        </div>
        <button type="submit" class="btn btn-orange w-100">إرسال الطلب</button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Send shipping service request to the backend. We treat each request as a
    // shipment with a default status of "قيد المعالجة" and no ETA or ref.
    document.getElementById('serviceForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const phoneCode = document.getElementById('phoneCode').value;
      const phone = document.getElementById('phone').value;
      const country = document.getElementById('country').value;
      const shippingType = document.getElementById('shippingType').value;
      const details = document.getElementById('details').value;
      // Create a shipment entry; ref is left blank and status defaults to قيد المعالجة
      const formData = new FormData();
      formData.append('type', shippingType);
      formData.append('ref', `${phoneCode} ${phone}`);
      formData.append('status', 'قيد المعالجة');
      formData.append('eta', '');
      formData.append('description', `الاسم: ${name}, البلد: ${country}, تفاصيل: ${details}`);
      try {
        const res = await fetch('/api/shipments', { method:'POST', body: formData });
        if(!res.ok) throw new Error('failed');
        alert('تم إرسال الطلب بنجاح! سنقوم بالتواصل معك قريبًا.');
        this.reset();
      } catch (err) {
        alert('حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
